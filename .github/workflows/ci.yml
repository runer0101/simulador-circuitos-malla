name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # plotters dibuja texto con fontconfig: sin estas cabeceras la compilacion falla.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f rust/Dockerfile -t simulador-circuitos-malla:ci .

      - name: Smoke test container
        run: |
          docker run --detach --name api --publish 8000:8000 simulador-circuitos-malla:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/api/health; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8000/api/health
          docker rm --force api
