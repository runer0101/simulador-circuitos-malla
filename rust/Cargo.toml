[package]
name = "simulador-circuitos-malla"
version = "0.1.0"
edition = "2021"
description = "Analisis de mallas de Kirchhoff para instalaciones residenciales"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
